name: build vast-forge hunyuan

# Builds the Hunyuan3D 2.1 engine image (Dockerfile.hunyuan) on GitHub's cloud and pushes it to GHCR as
# ghcr.io/<owner>/vast-forge:hunyuan (plus a per-commit tag). Trigger manually from the Actions tab, or on a push
# to main or the hunyuan branch that touches the build. The TRELLIS image keeps its own workflow (build.yml).
on:
  workflow_dispatch: {}
  push:
    branches: [main, hunyuan]
    paths:
      - Dockerfile.hunyuan
      - requirements-hunyuan.txt
      - engine_hunyuan.py
      - server.py
      - worker.py
      - .github/workflows/build-hunyuan.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel image plus torch and the pinned deps come to ~15 GB; reclaim the runner's preinstalled SDKs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hunyuan
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vast-forge:hunyuan
            ghcr.io/${{ github.repository_owner }}/vast-forge:hunyuan-${{ github.sha }}
          # Separate cache scope from the TRELLIS image so the two builds don't evict each other's compile layers.
          cache-from: type=gha,scope=hunyuan
          cache-to: type=gha,mode=max,scope=hunyuan
