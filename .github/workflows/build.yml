name: build vast-forge

# Builds the TRELLIS.2 image on GitHub's cloud (no corp VPN / Zscaler in the way) and pushes it to GHCR.
# Trigger manually from the Actions tab, or on a push that touches the build.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - Dockerfile
      - server.py
      - download_models.py
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to ghcr.io/<owner>/vast-forge — no PAT needed
    steps:
      - uses: actions/checkout@v4

      # The CUDA image is big; reclaim ~30 GB the runner wastes on preinstalled SDKs so the build fits.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vast-forge:latest
            ghcr.io/${{ github.repository_owner }}/vast-forge:${{ github.sha }}
